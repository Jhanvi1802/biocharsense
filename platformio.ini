; BiocharSense firmware v2 - ESP32 + ADS1115 + SIMCom A7672S (4G, MQTT over TLS)
;
;   pio run -e esp32dev                 build
;   pio run -e esp32dev -t upload       flash over USB
;   pio device monitor                  serial console (type `help`)
;   pio test -e native                  host unit tests for lib/core

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_eol = LF
monitor_echo = yes
board_build.filesystem = littlefs
board_build.partitions = min_lfs_ota.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    adafruit/Adafruit ADS1X15@^2.5.0
    vshymanskyy/TinyGSM@^0.12.0
    256dpi/MQTT@^2.5.2

[env:native]
platform = native
build_flags = -std=c++17
test_filter = test_core
